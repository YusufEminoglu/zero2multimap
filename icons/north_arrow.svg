<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="60" cy="80" r="46" fill="#ffffff" fill-opacity="0.92" stroke="#16323f" stroke-width="3"/>
    <circle cx="60" cy="80" r="39" fill="none" stroke="#2a8f85" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="60" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#16323f">N</text>
    <!-- North pointer (left dark teal, right slate) -->
    <polygon points="60,32 42,108 60,92" fill="#16323f" stroke="#16323f" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="60,32 78,108 60,92" fill="#2a8f85" stroke="#16323f" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="60" cy="80" r="4.5" fill="#ffffff" stroke="#16323f" stroke-width="2"/>
  </g>
